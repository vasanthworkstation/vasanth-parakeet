[package]
name = "speech-sidecar"
version = "0.1.0"
edition = "2021"
description = "Local speech-to-text sidecar for Vysper using Silero VAD + Moonshine Streaming"

[[bin]]
name = "speech-sidecar"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
rubato = "0.14"
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
crossbeam-channel = "0.5"
ringbuf = "0.3"
log = "0.4"
env_logger = "0.10"
hound = "3.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
